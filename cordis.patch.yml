# This package's bundle layer.
#
# `dsh plugin add dsh-openai-bridge` appends these rows to the profile's
# composition, because package.json declares `dsh.bundle.patch`.
#
# The route mounts on the EXISTING webserver, so it inherits that server's bind
# (127.0.0.1 by default — loopback only until a deployment deliberately binds
# 0.0.0.0). Bearer authentication is unconditional.
- insert:
    - id: openai-bridge
      name: dsh-openai-bridge
      config:
        # Empty string disables the bridge entirely. Set a real secret before
        # exposing this server beyond loopback.
        token: !!js process.env.DSH_OPENAI_BRIDGE_TOKEN ?? ''
        # Session workspace root for conversations this bridge creates.
        cwd: !!js process.env.DSH_OPENAI_BRIDGE_CWD ?? process.cwd()
        # Permission preset pinned onto each NEWLY CREATED session. It is
        # deliberately not re-pinned on later turns: doing that would silently
        # reset a preset the operator changed from the panel mid-conversation.
        permissionPreset: !!js process.env.DSH_OPENAI_BRIDGE_PERMISSION ?? 'read-only'
        agentPreset: !!js process.env.DSH_OPENAI_BRIDGE_PRESET ?? 'standard'
        # Browse allow-list for the /bridge panel. A string is one root (paths
        # stay relative to it); a list is several (a virtual root lists them);
        # the literal '*' is every fixed drive, enumerated live. Reads are
        # unrestricted for the agent either way — this only bounds what the panel
        # exposes through one token, over a cleartext LAN link.
        fileRoot: !!js process.env.DSH_OPENAI_BRIDGE_FILEROOT ?? undefined
        # Where the mobile panel mounts.
        panelPath: /bridge
        # Where the loopback-only setup page mounts. This is the ONE route served
        # before a token exists, so it answers only to requests from this machine
        # and returns 403 to everyone else. Open it to read the address a phone
        # should use, and to generate the token.
        setupPath: /setup
        # The token may also live in $DSH_HOME/openai-bridge.token. A token set
        # HERE always wins; the file is the fallback that lets the setup page mint
        # one in a click, without this file being edited by hand — and without the
        # plugin guessing at a profile it has no way to identify.
        # Which sessions the panel may answer approvals for: 'all' lets it answer
        # for any session it can open, 'bridge' narrows it to sessions in `cwd`.
        approvalScope: all

        # ── phone-triggered permission switching ──────────────────────────────
        # false removes the switch completely: the header chip never appears and
        # the whole permission API answers 404.
        permissionSwitch: true
        # Presets the phone may REQUEST. `danger-full-access` is excluded on
        # purpose: widening the sandbox to the whole machine is the one change
        # that cannot be walked back from a phone if it is granted by mistake.
        permissionPresets:
          - read-only
          - workspace-write
        # Leave empty and the server mints a one-time 6-digit code, shown ONLY on
        # the desktop popup. Set a value to use a fixed code that you choose.
        authorizationCode: !!js process.env.DSH_OPENAI_BRIDGE_AUTH_CODE ?? ''
        # How long a pending authorization stays confirmable (milliseconds).
        authorizationTtlMs: 180000
        # Auto-open the authorization popup on this PC. If opening it fails, the
        # handshake still works and the popup URL is written to the host log.
        desktopPopup: true

        # ── the per-client allowlist ─────────────────────────────────────────
        # A token that travelled in a URL can leak without anyone noticing, so a
        # leaked token must not be enough by itself. With this on, a peer that has
        # never been approved is refused EVERYTHING — the panel, the OpenAI face,
        # the approval console — until somebody at this machine reads the code on
        # the setup page and types it on that device. Loopback never pairs.
        #
        # This is NOT a boundary against someone already on the LAN: ARP spoofing
        # can impersonate an approved address, and DHCP hands a phone a new one
        # without asking. It makes a leaked token insufficient, nothing more.
        # `false` restores "whoever has the token is served".
        ipAllowlist: true
        # Where a not-yet-approved device posts its code. Must be reachable from
        # the LAN, and it is the only route that is — its whole power is checking
        # six digits against a code shown on this machine.
        pairingPath: /pair
        # How long a minted pairing code stays valid (milliseconds). Wrong codes
        # are tolerated `pairingAttempts` times per code; the code then dies with
        # it, and the device's next request — or the button on the setup page —
        # mints a fresh one.
        pairingTtlMs: 600000
        # Wrong codes tolerated per code before it is dead for the rest of its TTL.
        pairingAttempts: 5
        # Open the setup page on this machine by itself when a device starts
        # waiting, so the operator does not have to be watching for it. Set false
        # and the code is still there, just not pushed at you.
        pairingPopup: true
        # Shortest gap between two automatic popups (milliseconds). A sweep across
        # the LAN would otherwise open one window per address.
        pairingPopupCooldownMs: 15000
        # How many waiting devices are kept. Past this the oldest is dropped, so a
        # scan cannot fill the page with entries nobody will pair.
        pairingMaxPending: 16
        # Approved devices live in $DSH_HOME/openai-bridge-clients.json, written
        # when a device is approved and when one is removed from the setup page.

